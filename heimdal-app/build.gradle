plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

dependencies {
    implementation project(':heimdal-data')
    implementation project(':heimdal-analytics')
    implementation project(':heimdal-ui')
}

application {
    mainModule = 'com.marketterminal.app'
    mainClass = 'com.marketterminal.app.MainApp'
}

javafx {
    version = "21"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.web']
}
